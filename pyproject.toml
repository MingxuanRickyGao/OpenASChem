[build-system]
requires = ["setuptools>=68,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openaschem"
dynamic = ["version"]
description = "Compound-centric analysis of high-throughput pull-down AS-MS screens"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Mingxuan Gao", email = "mingxuan.gao@utoronto.ca"}]
keywords = ["AS-MS", "affinity selection", "mass spectrometry", "compound screening"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23,<2.1",
  "numba>=0.60,<0.61",
  "scipy>=1.10",
  "pandas>=1.5,<3",
  "click>=8",
  "pyteomics>=4.7,<5",
  "lxml",
  "openpyxl",
  "plotly>=5.18,<7",
]

[project.optional-dependencies]
gui = ["Pillow>=9"]
dev = ["ruff==0.17.1", "pytest>=7,<9", "build>=1,<2"]

[project.scripts]
openaschem = "openaschem.cli:openaschem"

[project.urls]
Repository = "https://github.com/huhehaotecrystal/OpenASChem"
Issues = "https://github.com/huhehaotecrystal/OpenASChem/issues"

[project.gui-scripts]
openaschem-gui = "openaschem.gui:main"
openaschem-filling-gui = "openaschem.gui:filling_main"

[tool.setuptools.dynamic]
version = {attr = "openaschem._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openaschem = ["templates/*.html", "assets/*.png", "assets/*.ico", "licenses/*.txt"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "src/openaschem/licenses/*.txt"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
