name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 provides the Python 3.9 binaries used by this matrix.
        os: [ubuntu-22.04, windows-latest]
        python: ["3.9", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[gui,dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Keep native Windows Tcl/Tk handles stable between GUI tests.
      - run: python -m pytest --capture=sys
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
